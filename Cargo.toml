[package]
name = "ypb"
version = "0.5.0"
edition = "2024"

[profile.release]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
strip = true
lto = true
codegen-units = 1
panic = 'abort'
incremental = false
rpath = false

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["tracing"] }
axum-extra = { version = "0.12.6", features = ["typed-header"] }
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
crc = "3.4.0"
futures = "0.3.34"
htmlize = "1.1.0"
indoc = "2.0.8"
mime_guess = "2.0.5"
pulldown-cmark = { version = "0.13.6", default-features = false, features = ["html"] }
serde = "1.0.229"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["fs"] }
tokio-util = { version = "0.7.20", features = ["io"] }
tower-http = { version = "0.7.1", features = ["timeout", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
